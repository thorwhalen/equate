# CI for the equate-rust package (rust/): lints, Rust unit tests, and the Python tests that
# exercise backend="rust". Linux only; the wheel matrix lives in rust-release.yml.
# equate itself is pure Python and is validated by ci.yml; this runs only when Rust-related
# files change.
name: rust-ci
on:
  push:
    branches: [master]
    paths:
      - "rust/**"
      - "equate/compare/sequence.py"
      - "tests/test_differential.py"
      - "tests/test_sequence.py"
      - "tests/test_port_surface.py"
      - "tests/_rust_shim.py"
      - "benchmarks/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "equate/compare/sequence.py"
      - "tests/test_differential.py"
      - "tests/test_sequence.py"
      - "tests/test_port_surface.py"
      - "tests/_rust_shim.py"
      - "benchmarks/**"
      - ".github/workflows/rust-ci.yml"

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny # warnings fail the build without invalidating the cache
  RUST_BACKTRACE: "1"

defaults:
  run:
    working-directory: rust

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      # pyo3's build script needs a Python interpreter to configure against
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
        env:
          PYO3_PYTHON: ${{ steps.py.outputs.python-path }}

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"] # the abi3 floor and a recent CPython
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: ${{ matrix.python }}
      - name: Rust unit tests (core crate, no libpython)
        run: cargo test -p equate-sequence-core --locked
      - name: Build the release wheel and install it, then equate and the test extras
        working-directory: .
        env:
          PYO3_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install ./rust
          python -m pip install -e ".[dev]" hypothesis dtaidistance biopython
      - name: Rust backend tests
        working-directory: .
        run: python -m pytest tests/test_differential.py tests/test_sequence.py tests/test_port_surface.py -q
      - name: Differential tests, thorough Hypothesis profile
        if: matrix.python == '3.13'
        working-directory: .
        timeout-minutes: 20
        env:
          HYPOTHESIS_PROFILE: thorough
        run: python -m pytest tests/test_differential.py -k rust -q
      - name: Whole test suite
        working-directory: .
        run: python -m pytest tests -q

  deny:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks: [advisories, "bans licenses sources"]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check ${{ matrix.checks }}
